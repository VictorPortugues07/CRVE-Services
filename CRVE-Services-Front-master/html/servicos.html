<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciamento de Serviços</title>
    <link rel="stylesheet" href="../css/servicos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <aside class="navBar">
        <img src="../imagens/Logo.png" id="logo" alt="Logo da Empresa" />
        <a href="../html/pagina-inicial.html"><i class="fa-solid fa-house"></i> Home</a>
        <a href="../html/produtos.html"><i class="fa-solid fa-box"></i> Produtos</a>
        <a href="../html/funcionarios.html"><i class="fa-solid fa-address-card"></i> Funcionários</a>
        <a href="../html/perfil.html"><i class="fa-solid fa-user"></i> Perfil</a>
        <a href="../html/servicos.html"><i class="fa-solid fa-taxi"></i> Serviços</a>
        <a href="../html/estoque.html"><i class="fa-solid fa-boxes-stacked"></i> Estoque</a>
        <a href="../html/login.html"><i class="fa-solid fa-circle-xmark"></i> Logout</a>
    </aside>
    
    <div class="container">
        <h2>Gerenciamento de Serviços</h2>
        
        <div class="formulario">
            <input type="hidden" id="servicoId">
            
            <input type="text" id="descricao" class="form-control" placeholder="Descrição do Serviço">
            
            <div style="display: flex; margin-bottom: 10px;">
                <div style="flex: 1; margin-right: 10px;">
                    <select id="status" class="form-control">
                        <option value="nao-iniciado">🔴 Não Iniciado</option>
                        <option value="andamento">🟡 Em Andamento</option>
                        <option value="concluido">🟢 Concluído</option>
                    </select>
                </div>
                <div style="flex: 1; margin-right: 10px;">
                    <input type="date" id="dataServico" class="form-control">
                </div>
                <div style="flex: 1;">
                    <select id="funcionarioId" class="form-control">
                        <option value="">Selecione o Funcionário</option>
                    </select>
                </div>
            </div>
            
            <div style="margin-bottom: 10px;">
                <label for="valorMaoDeObra">Valor Mão de Obra:</label>
                <input type="number" id="valorMaoDeObra" class="form-control" placeholder="R$ 0.00" step="0.01" min="0">
            </div>
            
            <div class="produtos-section">
                <div class="produtos-lista">
                    <h4>Produtos Disponíveis:</h4>
                    <div id="produtosDisponiveis">
                        <!-- Produtos serão carregados aqui -->
                    </div>
                </div>
                
                <div class="produtos-selecionados">
                    <h4>Produtos Selecionados:</h4>
                    <div id="produtosSelecionados">
                        <!-- Produtos selecionados serão mostrados aqui -->
                    </div>
                </div>
            </div>
            
            <div class="resumo-section">
                <div class="valor-total">
                    Total: <span id="valorTotal">R$ 0.00</span>
                </div>
            </div>
            
            <button id="addServiceBtn" class="btn btn-primary">Adicionar Serviço</button>
        </div>
        
        <table class="table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Descrição</th>
                    <th>Status</th>
                    <th>Data</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="tabelaServicos">
            
            </tbody>
        </table>
    </div>
    
    <div class="rodape">
        <p>&copy; 2025 Tech Digital Solutions. Todos os direitos reservados.</p>
    </div>
    
    <script src="../javascript/auth.js"></script>
    <script src="../javascript/servicos.js"></script>
</body>
</html>
