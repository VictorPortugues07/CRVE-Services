<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gerenciar Produtos</title>
  <link rel="stylesheet" href="../css/produtos.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
</head>
<body>
  <aside class="navBar">
    <img src="../imagens/Logo.png" id="logo" alt="Logo da Empresa" />
    <a href="../html/pagina-inicial.html"><i class="fa-solid fa-house"></i> Home</a>
    <a href="../html/produtos.html"><i class="fa-solid fa-box"></i> Produtos</a>
    <a href="../html/funcionarios.html"><i class="fa-solid fa-address-card"></i> Funcionários</a>
    <a href="../html/perfil.html"><i class="fa-solid fa-user"></i> Perfil</a>
    <a href="../html/servicos.html"><i class="fa-solid fa-taxi"></i> Serviços</a>
    <a href="../html/estoque.html"><i class="fa-solid fa-boxes-stacked"></i> Estoque</a>
    <a href="../html/login.html"><i class="fa-solid fa-circle-xmark"></i> Logout</a>
  </aside>

  <main class="container">
    <section class="cabecalho">
      <h2>Gerenciamento de Produtos</h2>
      <div class="form-produto">
        <input type="text" id="nmProduto" placeholder="Nome do Produto" />
        <input type="number" id="vlProduto" placeholder="Preço (R$)" step="0.01" min="0" />
        <button id="adicionar">Adicionar Produto</button>
        <!-- Campo oculto para ID do produto ao editar -->
        <input type="hidden" id="produtoId" />
      </div>
      <div id="mensagem" style="display:none;"></div>
    </section>

    <section class="lista-produtos">
      <div id="loading">
        <i class="fa-solid fa-spinner fa-spin"></i> Carregando produtos...
      </div>
      <table class="tabela">
        <thead>
          <tr>
            <th>ID</th>
            <th>Produto</th>
            <th>Preço</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="tabelaProdutos">
          <!-- Conteúdo dinâmico aqui -->
        </tbody>
      </table>
    </section>
  </main>

  <footer class="rodape">
    <p>&copy; 2025 Tech Digital Solutions. Todos os direitos reservados.</p>
  </footer>
  <script src="../javascript/auth.js"></script>
  <script src="../javascript/produtos.js"></script>
</body>
</html>
