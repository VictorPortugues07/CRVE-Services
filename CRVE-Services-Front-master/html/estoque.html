<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Estoque de Produtos</title>
  <link rel="stylesheet" href="../css/estoque.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
</head>
<body>
  <aside class="navBar">
    <img src="../imagens/Logo.png" id="logo" alt="Logo da Empresa" />
    <a href="../html/pagina-inicial.html"><i class="fa-solid fa-house"></i> Home</a>
    <a href="../html/produtos.html"><i class="fa-solid fa-box"></i> Produtos</a>
    <a href="../html/funcionarios.html"><i class="fa-solid fa-address-card"></i> Funcionários</a>
    <a href="../html/perfil.html"><i class="fa-solid fa-user"></i> Perfil</a>
    <a href="../html/servicos.html"><i class="fa-solid fa-taxi"></i> Serviços</a>
    <a href="../html/estoque.html"><i class="fa-solid fa-boxes-stacked"></i> Estoque</a>
    <a href="../html/login.html"><i class="fa-solid fa-circle-xmark"></i> Logout</a>
  </aside>

  <main class="container">
    <section class="cabecalho">
      <h2>Estoque de Produtos</h2>
      <button id="btnAdicionarEstoque" class="btn btn-primary">
        <i class="fa-solid fa-plus"></i> Adicionar Estoque
      </button>
    </section>

    <div id="loading">
      <i class="fa-solid fa-spinner fa-spin"></i> Carregando...
    </div>

    <section class="lista-produtos">
      <table class="tabela">
        <thead>
          <tr>
            <th>ID</th>
            <th>Produto</th>
            <th>Preço</th>
            <th>Estoque</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="tabelaProdutos">
        </tbody>
      </table>
    </section>
  </main>

  <!-- Modal para Gerenciamento de Estoque -->
  <div id="estoqueModal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <h3>Gerenciar Estoque</h3>
      
      <!-- Campos ocultos para ID -->
      <input type="hidden" id="produtoIdModal">
      <input type="hidden" id="estoqueIdModal">
      
      <!-- Seleção de produto (visível apenas ao adicionar novo) -->
      <div class="form-group" id="selecaoProdutoDiv">
        <label for="produtoSelect">Selecionar Produto:</label>
        <select id="produtoSelect" class="form-control" onchange="produtoSelecionado()">
          <option value="">Selecione um produto</option>
        </select>
      </div>
      
      <!-- Informações do produto -->
      <div class="form-group">
        <label>Produto:</label>
        <strong id="produtoNomeModal"></strong>
      </div>
      
      <!-- Controles de estoque -->
      <div class="form-group">
        <label for="quantidadeEstoque">Quantidade:</label>
        <input type="number" id="quantidadeEstoque" class="form-control" min="0">
      </div>
      
      <div class="form-group">
        <label for="unidadeEstoque">Unidade:</label>
        <select id="unidadeEstoque" class="form-control">
          <option value="unidade">Unidade</option>
          <option value="kg">Quilograma (kg)</option>
          <option value="g">Grama (g)</option>
          <option value="l">Litro (l)</option>
          <option value="ml">Mililitro (ml)</option>
        </select>
      </div>
      
      <div class="form-group">
        <button id="salvarEstoque" class="btn btn-primary">Salvar</button>
      </div>
    </div>
  </div>

  <footer class="rodape">
    <p>&copy; 2025 Tech Digital Solutions. Todos os direitos reservados.</p>
  </footer>

  <script src="../javascript/estoque.js"></script>
</body>
</html>
```
