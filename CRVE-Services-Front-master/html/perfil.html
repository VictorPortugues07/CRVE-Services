<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Perfil do Usuário</title>
  <link rel="stylesheet" href="../css/perfil.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
</head>
<body>
  <aside class="navBar">
    <img src="../imagens/Logo.png" id="logo" alt="Logo da Empresa" />
    <a href="../html/pagina-inicial.html"><i class="fa-solid fa-house"></i> Home</a>
    <a href="../html/produtos.html"><i class="fa-solid fa-box"></i> Produtos</a>
    <a href="../html/funcionarios.html"><i class="fa-solid fa-address-card"></i> Funcionários</a>
    <a href="../html/perfil.html"><i class="fa-solid fa-user"></i> Perfil</a>
    <a href="../html/servicos.html"><i class="fa-solid fa-taxi"></i> Serviços</a>
    <a href="../html/estoque.html"><i class="fa-solid fa-boxes-stacked"></i> Estoque</a>
    <a href="../html/login.html"><i class="fa-solid fa-circle-xmark"></i> Logout</a>
  </aside>

  <main class="mainContainer">
    <section class="cabecalho">
      <h2>Perfil do Usuário</h2>
    </section>

    <section class="perfil">
      <div class="perfilInfo">
        <img src="../imagens/perfil.png" alt="Foto do Usuário" id="imagemPerfil"/>

        <div class="info">
          <!-- Campo oculto para ID do funcionário -->
          <input type="hidden" id="funcionarioId" />
          
          <div class="inputGroup">
            <label for="nome">Nome</label>
            <input class="input-edit" type="text" id="nome" disabled />
          </div>

          <div class="inputGroup">
            <label for="email">Email</label>
            <input class="input-edit" type="email" id="email" disabled />
          </div>

          <div class="inputGroup">
            <label for="senha">Senha</label>
            <input class="input-edit" type="password" id="senha" disabled />
          </div>

          <div style="margin-top: 20px;">
            <button id="btnEditar" onclick="habilitarEdicao()">Atualizar</button>
            <button id="btnSalvar" onclick="salvarEdicao()" style="display: none;">Salvar</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="rodape">
    <p>&copy; 2025 Tech Digital Solutions. Todos os direitos reservados.</p>
  </footer>
  <script src="../javascript/auth.js"></script>
  <script src="../javascript/perfil.js"></script>
</body>
</html>
